{{ define "main" }}
  <article class="post-single">
    <header class="post-header">
      <h1 class="post-title">{{ .Title }}</h1>
      {{ with .Description }}
        <div class="post-description">{{ . }}</div>
      {{ end }}
    </header>

    {{ if .Content }}
      <div class="post-content">
        {{ .Content }}
      </div>
    {{ end }}

    {{ partial "post_list.html" . }}
  </article>
{{ end }}
